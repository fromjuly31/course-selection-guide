<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071720">
  <title>우리학교 선택과목 안내</title>
  <meta name="description" content="학교 교육과정에 맞춰 선택과목을 이해하고 진로에 맞는 과목을 설계하는 안내 플랫폼">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="landing.css">
</head>
<body class="landing-page landing-one-screen">
  <header class="landing-header">
    <a class="landing-brand" href="index.html" aria-label="우리학교 선택과목 안내 메인">
      <span class="landing-brand-mark"><svg class="icon" aria-hidden="true"><use href="icons.svg#school"></use></svg></span>
      <span><strong>우리학교</strong><small>선택과목 안내</small></span>
    </a>
    <span class="edition-chip"><i></i> 2027 입학생</span>
  </header>

  <main>
    <section class="hero-stage" aria-labelledby="main-title">
      <div class="hero-ambient" aria-hidden="true">
        <span class="ambient-orb orb-one"></span>
        <span class="ambient-orb orb-two"></span>
        <span class="ambient-grid"></span>
      </div>

      <div class="hero-inner">
        <div class="landing-hero-copy">
          <p class="landing-kicker"><span>2022 개정 교육과정</span><span>COURSE GUIDE</span></p>
          <h1 id="main-title">배움의 선택이<br><em>진로의 방향</em>이 됩니다.</h1>
          <p class="landing-lead">과목을 고르는 일은 앞으로의 배움을 설계하는 일입니다.<br class="desktop-break"> 우리학교 교육과정 안에서 나에게 맞는 선택을 시작해 보세요.</p>
          <p class="nav-hint"><span></span>아래 메뉴에서 탐색을 시작하세요</p>
        </div>

        <div class="curriculum-constellation" data-parallax role="img" aria-label="과목들이 진로를 중심으로 연결되는 모습을 표현한 그래픽">
          <span class="constellation-label">CURRICULUM<br>CONNECTION</span>
          <span class="constellation-axis axis-x"></span>
          <span class="constellation-axis axis-y"></span>
          <span class="constellation-orbit orbit-a"></span>
          <span class="constellation-orbit orbit-b"></span>
          <span class="constellation-orbit orbit-c"></span>
          <span class="constellation-core">
            <svg class="icon" aria-hidden="true"><use href="icons.svg#compass"></use></svg>
            <small>MY PATH</small>
            <strong>나의 진로</strong>
          </span>
          <span class="subject-point subject-korean"><i></i>언어·인문</span>
          <span class="subject-point subject-math"><i></i>수학·정보</span>
          <span class="subject-point subject-science"><i></i>과학·기술</span>
          <span class="subject-point subject-social"><i></i>사회·문화</span>
          <span class="subject-point subject-art"><i></i>예술·체육</span>
          <span class="constellation-number number-one">01</span>
          <span class="constellation-number number-two">02</span>
          <span class="constellation-number number-three">03</span>
        </div>
      </div>

      <p class="hero-side-note" aria-hidden="true">EXPLORE · RECOMMEND · SIMULATE</p>
    </section>
  </main>

  <nav class="bottom-nav landing-bottom-nav" aria-label="주요 메뉴">
    <a class="nav-item" href="index.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="icons.svg#home"></use></svg><span>메인</span></a>
    <a class="nav-item" href="section.html?tab=subjects"><svg class="icon" aria-hidden="true"><use href="icons.svg#book"></use></svg><span>과목 안내</span></a>
    <a class="nav-item" href="section.html?tab=departments"><svg class="icon" aria-hidden="true"><use href="icons.svg#compass"></use></svg><span>학과 안내</span></a>
    <a class="nav-item" href="section.html?tab=recommend"><svg class="icon" aria-hidden="true"><use href="icons.svg#sparkles"></use></svg><span>과목 추천</span></a>
    <a class="nav-item" href="section.html?tab=simulation"><svg class="icon" aria-hidden="true"><use href="icons.svg#route"></use></svg><span>시뮬레이션</span></a>
    <a class="nav-item" href="section.html?tab=admin"><svg class="icon" aria-hidden="true"><use href="icons.svg#settings"></use></svg><span>데이터 관리</span></a>
  </nav>

  <script src="landing.js"></script>
</body>
</html>
