<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071720">
  <title>학과·선택과목 조회 · 선택 과목 안내 플랫폼</title>
  <meta name="description" content="학교별 편제표와 연동되는 과목 선택 안내 플랫폼">
  <link rel="stylesheet" href="styles.css?v=20260905-5">
  <link rel="stylesheet" href="app.css?v=20260905-12">
  <link rel="stylesheet" href="chatbot.css?v=20260905-6">
</head>
<body class="app-page">
  <header class="app-header">
    <div class="app-header-inner">
      <a class="app-brand" href="index.html" aria-label="메인으로 이동">
        <span class="app-brand-mark"><svg class="icon" aria-hidden="true"><use href="icons.svg#school"></use></svg></span>
        <span><strong>선택 과목 안내 플랫폼</strong></span>
      </a>
      <div class="header-school-picker" data-school-picker>
        <button type="button" data-school-trigger aria-expanded="false">
          <i></i><span><strong data-school-picker-label>미선택</strong><small data-school-picker-meta>현재 연동 학교</small></span>
          <svg class="icon" aria-hidden="true"><use href="icons.svg#arrow"></use></svg>
        </button>
        <button class="school-disconnect-button" type="button" data-school-disconnect hidden>연동 해제</button>
        <dialog class="header-school-menu school-picker-dialog" data-school-menu aria-labelledby="header-school-dialog-title">
          <button class="school-picker-dialog-close" type="button" data-school-menu-close aria-label="학교 목록 닫기">×</button>
          <section data-school-list-view>
            <header class="school-picker-dialog-head"><div><small>CONNECTED SCHOOLS</small><h2 id="header-school-dialog-title">연동 학교 목록</h2></div><strong data-header-school-search-count>0개 학교</strong></header>
            <div class="school-picker-current" data-school-current><div class="school-picker-current-copy"><strong data-school-current-name>미선택</strong><small data-school-current-meta>현재 연동 학교</small></div><button class="school-disconnect-button" type="button" data-school-disconnect hidden>연동 해제</button></div>
            <label class="header-school-search school-picker-search"><svg class="icon" aria-hidden="true"><use href="icons.svg#search"></use></svg><input type="search" placeholder="지역명 또는 학교명 검색" autocomplete="off" data-header-school-search></label>
            <div data-school-options><span class="school-menu-empty">학교 목록을 불러오는 중입니다.</span></div>
          </section>
          <section class="school-year-choice" data-school-year-view hidden>
            <button class="school-year-back" type="button" data-school-year-back><svg class="icon" aria-hidden="true"><use href="icons.svg#arrow"></use></svg> 학교 목록</button>
            <small data-school-year-meta></small>
            <h2 data-school-year-name>학교명</h2>
            <p>연동할 입학년도를 선택하세요.</p>
            <div data-school-year-options></div>
          </section>
        </dialog>
      </div>
    </div>
  </header>

  <main class="app-main" id="app-root" tabindex="-1">
    <div class="initial-loading" role="status"><span></span><p>데이터베이스를 불러오고 있습니다.</p></div>
  </main>

  <dialog class="sheet-dialog" id="record-dialog" aria-labelledby="record-dialog-title">
    <span class="dialog-handle" aria-hidden="true"></span>
    <button class="dialog-close" type="button" data-dialog-close aria-label="닫기">×</button>
    <div data-record-dialog-content></div>
  </dialog>

  <dialog class="recommend-notice-dialog" id="recommend-notice-dialog" aria-labelledby="recommend-notice-title" aria-describedby="recommend-notice-description">
    <div class="recommend-notice-symbol" aria-hidden="true"><svg class="icon"><use href="icons.svg#warning"></use></svg></div>
    <p class="recommend-notice-kicker">BEFORE YOU START</p>
    <h2 id="recommend-notice-title">꼭 확인하세요!</h2>
    <div class="recommend-notice-message" id="recommend-notice-description">
      <strong>과목 추천의 결과는 참고용입니다.</strong>
      <p>100% 신뢰하지 말고 반드시 최종 검토하세요.</p>
      <p>과목 선택의 책임은 본인에게 있습니다.</p>
    </div>
    <button class="recommend-notice-confirm" type="button" data-recommend-notice-confirm>확인했습니다</button>
  </dialog>

  <dialog class="curriculum-alert-dialog" id="curriculum-alert-dialog" aria-labelledby="curriculum-alert-title" aria-describedby="curriculum-alert-message">
    <button class="curriculum-alert-close" type="button" data-curriculum-alert-close aria-label="닫기">×</button>
    <div class="curriculum-alert-symbol" aria-hidden="true"><svg class="icon"><use href="icons.svg#warning"></use></svg></div>
    <p class="curriculum-alert-kicker">데이터 확인 안내</p>
    <h2 id="curriculum-alert-title">편제표를 확인해 주세요</h2>
    <p class="curriculum-alert-message" id="curriculum-alert-message"></p>
    <button class="curriculum-alert-confirm" type="button" data-curriculum-alert-close>확인</button>
  </dialog>

  <div class="app-toast" role="status" aria-live="polite" data-app-toast></div>

  <nav class="bottom-nav app-bottom-nav" aria-label="주요 메뉴">
    <button class="nav-item" type="button" data-nav-href="index.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#home"></use></svg><span>메인</span></button>
    <button class="nav-item" type="button" data-nav-href="section.html?tab=subjects&amp;v=20260905-3" data-tab="subjects"><svg class="icon" aria-hidden="true"><use href="icons.svg#book"></use></svg><span>과목 안내</span></button>
    <button class="nav-item" type="button" data-nav-href="section.html?tab=departments&amp;v=20260905-3" data-tab="departments"><svg class="icon" aria-hidden="true"><use href="icons.svg#graduation"></use></svg><span>학과 안내</span></button>
    <button class="nav-item" type="button" data-nav-href="section.html?tab=recommend&amp;v=20260905-3" data-tab="recommend"><svg class="icon" aria-hidden="true"><use href="icons.svg#sparkles"></use></svg><span>과목 추천</span></button>
    <button class="nav-item" type="button" data-nav-href="section.html?tab=simulation&amp;v=20260905-3" data-tab="simulation"><svg class="icon" aria-hidden="true"><use href="icons.svg#checklist"></use></svg><span>모의 수강신청</span></button>
    <button class="nav-item" type="button" data-nav-href="section.html?tab=admin&amp;v=20260905-3" data-tab="admin"><svg class="icon" aria-hidden="true"><use href="icons.svg#settings"></use></svg><span>데이터 연동</span></button>
  </nav>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="supabase-config.js?v=20260905-2"></script>
  <script src="school-data.js?v=20260905-4"></script>
  <script src="app-data.js?v=20260905-3"></script>
  <script src="app.js?v=20260905-7"></script>
  <script src="chatbot-engine.js?v=20260905-6"></script>
  <script src="chatbot.js?v=20260905-7"></script>
</body>
</html>
